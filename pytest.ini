[pytest]
; ---------- 用例发现 ----------
testpaths = script
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; ---------- 运行参数 ----------
addopts =
    -v
    -s
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir

; ---------- 自定义标记 ----------
markers =
    smoke: 冒烟用例，覆盖核心主流程
    ui: 依赖真实浏览器渲染的用例

; ---------- 日志 ----------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)-22s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
